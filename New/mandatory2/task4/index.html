<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 4 - Chocolate shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page">
    <!-- Header image takes about 1/3 of the page height -->
    <img id="header" alt="Header image">

    <!-- 4c: category buttons are made in JavaScript -->
    <div id="categories"></div>

    <!-- 4a: list of chocolates -->
    <div id="list"></div>
  </div>

  <!-- 4b: dialog with large image -->
  <dialog id="dialog">
    <img id="dialogImage" alt="Chocolate">
    <h2 id="dialogName"></h2>
    <p id="dialogHeading"></p>
    <p id="dialogPrice"></p>
    <button id="closeButton">Close</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
